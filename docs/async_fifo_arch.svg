<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1120" height="580" rx="12" fill="#f8fafc"/>
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Parameterized Dual-Clock Asynchronous FIFO (Gray-Code CDC Architecture)</text>
  <text x="560" y="54" text-anchor="middle" font-size="12.5" fill="#475569">DATA_WIDTH=32 | DEPTH=2^ADDR_WIDTH | 2-FF Gray Synchronizers | Async-Assert / Sync-Deassert Reset Bridges | Conservative Levels</text>

  <!-- Write Clock Domain Region -->
  <rect x="28" y="72" width="470" height="472" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="28" y="72" width="470" height="32" rx="12" fill="#1d4ed8"/>
  <rect x="28" y="92" width="470" height="12" fill="#1d4ed8"/>
  <text x="263" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">WRITE CLOCK DOMAIN (wclk / wrst_sync_n)</text>

  <!-- Read Clock Domain Region -->
  <rect x="622" y="72" width="470" height="472" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <rect x="622" y="72" width="470" height="32" rx="12" fill="#0f766e"/>
  <rect x="622" y="92" width="470" height="12" fill="#0f766e"/>
  <text x="857" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">READ CLOCK DOMAIN (rclk / rrst_sync_n)</text>

  <!-- CDC Boundary Line -->
  <line x1="560" y1="68" x2="560" y2="554" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="504" y="74" width="112" height="24" rx="12" fill="#dc2626"/>
  <text x="560" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">CDC BOUNDARY</text>

  <!-- Dual-Port RAM (straddling CDC) -->
  <rect x="448" y="122" width="224" height="114" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="448" y="122" width="224" height="28" rx="10" fill="#334155"/>
  <rect x="448" y="138" width="224" height="12" fill="#334155"/>
  <text x="560" y="141" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">fifo_mem_dp (Dual-Port RAM)</text>
  <text x="560" y="170" text-anchor="middle" font-size="11.5" fill="#1e293b">DEPTH × DATA_WIDTH</text>
  <text x="560" y="189" text-anchor="middle" font-size="11" fill="#475569">Sync Write (wclk, winc &amp;&amp; !wfull)</text>
  <text x="560" y="207" text-anchor="middle" font-size="11" fill="#475569">Show-Ahead / FWFT Read (raddr)</text>
  <text x="560" y="225" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">BRAM / M10K / ASIC SRAM Ready</text>

  <!-- Write Pointer & Full Logic Block -->
  <rect x="64" y="264" width="236" height="156" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="182" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Write Pointer &amp; Flag Logic</text>
  <line x1="76" y1="295" x2="288" y2="295" stroke="#dbeafe" stroke-width="1.5"/>
  <text x="80" y="314" font-size="11" fill="#1e293b">• wbin_next = wbin + (winc &amp; !wfull)</text>
  <text x="80" y="332" font-size="11" fill="#1e293b">• wptr = bin2gray(wbin) [1-bit step]</text>
  <text x="80" y="350" font-size="11" fill="#1e293b">• wfull (direct Gray MSB-inv cmp)</text>
  <text x="80" y="368" font-size="11" fill="#1e293b">• wlevel = wbin_next - gray2bin(wq2)</text>
  <text x="80" y="386" font-size="11" fill="#1e293b">• walmost_full (free ≤ AF_THRESH)</text>
  <text x="80" y="404" font-size="11" fill="#1e293b">• woverflow guard (blocks overwrite)</text>

  <!-- Read Pointer & Empty Logic Block -->
  <rect x="820" y="264" width="236" height="156" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="938" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#115e59">Read Pointer &amp; Flag Logic</text>
  <line x1="832" y1="295" x2="1044" y2="295" stroke="#ccfbf1" stroke-width="1.5"/>
  <text x="836" y="314" font-size="11" fill="#1e293b">• rbin_next = rbin + (rinc &amp; !rempty)</text>
  <text x="836" y="332" font-size="11" fill="#1e293b">• rptr = bin2gray(rbin) [1-bit step]</text>
  <text x="836" y="350" font-size="11" fill="#1e293b">• rempty (rgray_next == rq2_wptr)</text>
  <text x="836" y="368" font-size="11" fill="#1e293b">• rlevel = gray2bin(rq2) - rbin_next</text>
  <text x="836" y="386" font-size="11" fill="#1e293b">• ralmost_empty (used ≤ AE_THRESH)</text>
  <text x="836" y="404" font-size="11" fill="#1e293b">• runderflow guard (freezes rptr)</text>

  <!-- Synchronizer W2R (inside Read Domain) -->
  <rect x="640" y="274" width="144" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="712" y="296" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">u_sync_w2r</text>
  <text x="712" y="313" text-anchor="middle" font-size="10.5" fill="#7f1d1d">2-FF CDC Sync (rclk)</text>
  <text x="712" y="328" text-anchor="middle" font-size="9.5" fill="#991b1b">ASYNC_REG + max_delay</text>

  <!-- Synchronizer R2W (inside Write Domain) -->
  <rect x="336" y="348" width="144" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="408" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">u_sync_r2w</text>
  <text x="408" y="387" text-anchor="middle" font-size="10.5" fill="#7f1d1d">2-FF CDC Sync (wclk)</text>
  <text x="408" y="402" text-anchor="middle" font-size="9.5" fill="#991b1b">ASYNC_REG + max_delay</text>

  <!-- Reset Synchronizer W -->
  <rect x="64" y="454" width="204" height="68" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="166" y="476" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">u_wrst_sync (cdc_reset_sync)</text>
  <text x="166" y="494" text-anchor="middle" font-size="10.5" fill="#475569">Async Assert / Sync Deassert</text>
  <text x="166" y="510" text-anchor="middle" font-size="10" fill="#1d4ed8">wrst_n → wrst_sync_n</text>

  <!-- Reset Synchronizer R -->
  <rect x="852" y="454" width="204" height="68" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="954" y="476" text-anchor="middle" font-size="11.5" font-weight="700" fill="#115e59">u_rrst_sync (cdc_reset_sync)</text>
  <text x="954" y="494" text-anchor="middle" font-size="10.5" fill="#475569">Async Assert / Sync Deassert</text>
  <text x="954" y="510" text-anchor="middle" font-size="10" fill="#0f766e">rrst_n → rrst_sync_n</text>

  <!-- Arrows -->
  <!-- wdata/winc into RAM -->
  <line x1="42" y1="166" x2="444" y2="166" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="115" y="159" font-size="11" font-weight="600" fill="#1d4ed8">wdata [DATA_WIDTH-1:0]</text>
  <!-- waddr from Write Logic to RAM -->
  <polyline points="182,264 182,206 444,206" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="275" y="199" font-size="10.5" font-weight="600" fill="#1d4ed8">waddr, w_en</text>

  <!-- rdata out of RAM -->
  <line x1="672" y1="166" x2="1078" y2="166" stroke="#0f766e" stroke-width="2" marker-end="url(#arrTeal)"/>
  <text x="920" y="159" font-size="11" font-weight="600" fill="#0f766e">rdata [DATA_WIDTH-1:0]</text>
  <!-- raddr from Read Logic to RAM -->
  <polyline points="938,264 938,206 676,206" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrTeal)"/>
  <text x="768" y="199" font-size="10.5" font-weight="600" fill="#0f766e">raddr</text>

  <!-- wptr (Gray) crossing CDC W -> R -->
  <line x1="300" y1="305" x2="636" y2="305" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <rect x="498" y="291" width="124" height="20" rx="4" fill="#fee2e2"/>
  <text x="560" y="305" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">wptr (Gray CDC)</text>
  <line x1="784" y1="305" x2="816" y2="305" stroke="#0f766e" stroke-width="2" marker-end="url(#arrTeal)"/>
  <text x="799" y="297" text-anchor="middle" font-size="9.5" fill="#0f766e">rq2</text>

  <!-- rptr (Gray) crossing CDC R -> W -->
  <line x1="820" y1="379" x2="484" y2="379" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <rect x="498" y="365" width="124" height="20" rx="4" fill="#fee2e2"/>
  <text x="560" y="379" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">rptr (Gray CDC)</text>
  <line x1="336" y1="379" x2="304" y2="379" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="320" y="371" text-anchor="middle" font-size="9.5" fill="#1d4ed8">wq2</text>

  <!-- Formal Verification Badge Box -->
  <rect x="336" y="454" width="448" height="68" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="560" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Formal Verification &amp; STA Sign-Off</text>
  <text x="560" y="494" text-anchor="middle" font-size="10.5" fill="#334155">SymbiYosys (BMC + Unbounded k-Induction + Cover) | 2-Value Data Contract</text>
  <text x="560" y="511" text-anchor="middle" font-size="10.5" fill="#334155">SVA Protocol Assertions | Quartus TimeQuest Async-Clock SDC Sign-Off</text>

  <!-- Footer -->
  <text x="560" y="568" text-anchor="middle" font-size="11" fill="#64748b">Designed &amp; Verified by Anton Magdy (@AntonMagdy111) — Apache-2.0 License</text>
</svg>
